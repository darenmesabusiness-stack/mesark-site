name: Account safeguards
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  accounts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mesa_owner_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/test-auth.mts
      - run: npx tsx scripts/test-owner-concurrency.mts
        env:
          OWNER_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/mesa_owner_test
      - run: npx tsc --noEmit --incremental false
